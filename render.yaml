services:
  - type: web
    name: brasileirao-manager-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements-lock.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --ws-max-size 4096 --proxy-headers
    healthCheckPath: /api/v1/health
    numInstances: 1
    envVars:
      - key: APP_ENVIRONMENT
        value: production
      - key: APP_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://brasileirao-manager-web.onrender.com
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: ENABLE_JSON_SNAPSHOTS
        value: "true"
      - key: SNAPSHOT_PATH
        value: /tmp/brasileirao-manager/rooms.json
      - key: PLAYER_CATALOG_PATH
        value: ../data/catalogs/players.json
      - key: ENABLE_DEMO_CATALOG
        value: "false"
      - key: REQUEST_LIMIT_PER_MINUTE
        value: "600"
      - key: AUTH_LIMIT_PER_MINUTE
        value: "120"
      - key: MAX_REQUEST_BODY_BYTES
        value: "1048576"

  - type: web
    name: brasileirao-manager-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: frontend/dist
    buildFilter:
      paths:
        - frontend/**
        - render.yaml
    envVars:
      - key: VITE_API_BASE_URL
        value: https://brasileirao-manager-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
