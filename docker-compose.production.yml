services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENVIRONMENT: production
      APP_SECRET: ${APP_SECRET:?APP_SECRET must be set}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
      SESSION_COOKIE_SECURE: "true"
      ENABLE_JSON_SNAPSHOTS: "true"
      SNAPSHOT_PATH: /data/snapshots/rooms.json
      ENABLE_DEMO_CATALOG: "false"
      PLAYER_CATALOG_PATH: /data/catalogs/players.json
      REQUEST_LIMIT_PER_MINUTE: ${REQUEST_LIMIT_PER_MINUTE:-600}
      AUTH_LIMIT_PER_MINUTE: ${AUTH_LIMIT_PER_MINUTE:-120}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-1048576}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --ws-max-size 4096
    volumes:
      - ./data:/data
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"
